receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    send_batch_size: 1024
    send_batch_max_size: 1024
    timeout: 1s

exporters:
  kafka:
    brokers:
      - kafka:29092
    logs:
      topic: netstream.events.v1
      encoding: otlp_proto
    metrics:
      topic: netstream.metrics.v1
      encoding: otlp_proto
    # Without this, logs are partitioned round-robin: two records from the
    # same sensor (host.id) can land on different partitions, where Kafka
    # gives no ordering guarantee at all between them — breaking
    # ml-online-detector's WindowAccumulator, which assumes a later
    # same-source record closes a window and so needs same-sensor records
    # to arrive in order. Hashing by resource attributes keeps one
    # sensor's records on one partition for the life of its process
    # (service.instance.id — the agent's boot_id — is part of the
    # resource, so a restart can land on a different partition; that's a
    # natural ordering break point anyway, not a new one).
    partition_logs_by_resource_attributes: true
    producer:
      max_message_bytes: 4194304
      compression: zstd
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka]
