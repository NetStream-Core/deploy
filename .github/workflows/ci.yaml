name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install yamllint

      - run: yamllint -c .yamllint.yaml .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cp .env.example .env

      - run: docker compose -f compose.yml config --quiet

      - run: docker compose -f compose.yml -f lab/compose.lab.yml config --quiet

      - run: |
          docker run --rm -v "$PWD/collector/edge.yaml:/cfg.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.161.0 validate --config /cfg.yaml

      - run: |
          docker run --rm -v "$PWD/collector/gateway.yaml:/cfg.yaml:ro" \
            -e CLICKHOUSE_DB=x -e CLICKHOUSE_USER=x -e CLICKHOUSE_PASSWORD=x \
            otel/opentelemetry-collector-contrib:0.161.0 validate --config /cfg.yaml
