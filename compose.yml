name: netstream

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-netstream}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-netstream}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-netstream-dev}

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.10
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    mem_limit: 900m
    logging: *logging

  kafka-init:
    image: confluentinc/cp-kafka:7.9.10
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -e
        for topic in netstream.events.v1 netstream.metrics.v1; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000
        done
    logging: *logging

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 1200m
    logging: *logging

  migrate:
    image: clickhouse/clickhouse-server:25.8
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./clickhouse/migrate.sh:/migrate.sh:ro
      - ./clickhouse/migrations:/migrations:ro
    logging: *logging

  otel-edge:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${EDGE_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${EDGE_HTTP_PORT:-4318}:4318"
    volumes:
      - ./collector/edge.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 300m
    logging: *logging

  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *clickhouse-env
    volumes:
      - ./collector/gateway.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 300m
    logging: *logging

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [debug]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: netstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    mem_limit: 400m
    logging: *logging

volumes:
  kafka-data:
  clickhouse-data:
